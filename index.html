<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jacco Console</title>
<style>
:root{--accent:#ff5a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:240px;height:282px;margin:0;overflow:hidden;background:#090909;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{width:240px;height:282px;padding:12px;border:3px solid var(--accent);display:flex;flex-direction:column;transition:.2s}
header{display:flex;justify-content:space-between;align-items:center}
.brand{color:#aaa;font-size:10px;font-weight:700;letter-spacing:1.4px}
.status{color:#aaa;font-size:9px}
.dot{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#35d072;box-shadow:0 0 7px #35d072}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.icon{font-size:31px;margin-bottom:7px}
h1{font-size:27px;margin:0}
.hint{width:180px;min-height:34px;margin:9px 0 0;color:#bbb;font-size:11px;line-height:1.35}
footer{display:grid;grid-template-columns:38px 1fr 38px;gap:7px}
button{border:0;color:#fff;cursor:pointer}
.arrow{height:36px;border-radius:10px;background:#242424;font-size:20px}
.talk{height:40px;border-radius:11px;background:var(--accent);font-size:11px;font-weight:800}
.talk.active{transform:scale(.96);filter:brightness(1.2)}
.pager{height:8px;display:flex;justify-content:center;gap:4px;margin-top:4px}
.pip{width:5px;height:5px;border-radius:5px;background:#555}
.pip.on{width:14px;background:var(--accent)}
#toast{position:absolute;top:42px;left:20px;width:200px;padding:8px;border-radius:8px;background:#eee;color:#111;text-align:center;font-size:10px;font-weight:bold;opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<section id="app">
  <div id="toast">Stand gewijzigd</div>

  <header>
    <span class="brand">JACCO CONSOLE</span>
    <span class="status"><span class="dot"></span><span id="state">GEREED</span></span>
  </header>

  <main>
    <div class="icon" id="icon">◆</div>
    <h1 id="name">WERK</h1>
    <div class="hint" id="hint">Beleid, criminaliteit en cybersecurity</div>
  </main>

  <footer>
    <button class="arrow" id="prev">‹</button>
    <button class="talk" id="talk">HOUD IN &amp; SPREEK</button>
    <button class="arrow" id="next">›</button>
  </footer>

  <div class="pager" id="pager"></div>
</section>

<script>
const modes=[
 {name:"WERK",icon:"◆",color:"#ff5a1f",hint:"Beleid, criminaliteit en cybersecurity"},
 {name:"SCRIPTIE",icon:"✦",color:"#8b7cff",hint:"Denk, toets en leg onderzoeksideeën vast"},
 {name:"THUIS",icon:"⌂",color:"#35d072",hint:"Mac mini, Synology en dagelijkse routines"},
 {name:"VOERTUIGEN",icon:"◉",color:"#46a7ff",hint:"BMW, Africa Twin en DR650-logboek"}
];

let index=Number(localStorage.getItem("console-mode")||0);
let listening=false;
let timer;

const nameEl=document.getElementById("name");
const iconEl=document.getElementById("icon");
const hintEl=document.getElementById("hint");
const pager=document.getElementById("pager");
const talk=document.getElementById("talk");
const state=document.getElementById("state");
const toast=document.getElementById("toast");

function render(notify=false){
 const m=modes[index];
 document.documentElement.style.setProperty("--accent",m.color);
 nameEl.textContent=m.name;
 iconEl.textContent=m.icon;
 hintEl.textContent=m.hint;
 pager.innerHTML=modes.map((_,i)=>`<span class="pip ${i===index?"on":""}"></span>`).join("");
 localStorage.setItem("console-mode",index);
 if(notify)show(m.name);
}

function move(step){
 index=(index+step+modes.length)%modes.length;
 render(true);
}

function show(text){
 toast.textContent=text;
 toast.classList.add("show");
 clearTimeout(timer);
 timer=setTimeout(()=>toast.classList.remove("show"),700);
}

function listenStart(){
 if(listening)return;
 listening=true;
 talk.classList.add("active");
 talk.textContent="LUISTEREN…";
 state.textContent="LUISTERT";
}

function listenEnd(){
 if(!listening)return;
 listening=false;
 talk.classList.remove("active");
 talk.textContent="HOUD IN & SPREEK";
 state.textContent="GEREED";
 show("Test ontvangen · "+modes[index].name);
}

document.getElementById("prev").onclick=()=>move(-1);
document.getElementById("next").onclick=()=>move(1);

talk.addEventListener("pointerdown",listenStart);
talk.addEventListener("pointerup",listenEnd);
talk.addEventListener("pointercancel",listenEnd);

window.addEventListener("scrollUp",()=>move(-1));
window.addEventListener("scrollDown",()=>move(1));
window.addEventListener("sideClick",()=>show("Geselecteerd · "+modes[index].name));
window.addEventListener("longPressStart",listenStart);
window.addEventListener("longPressEnd",listenEnd);

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="ArrowUp")move(-1);
 if(e.key==="ArrowRight"||e.key==="ArrowDown")move(1);
 if(e.code==="Space"){e.preventDefault();listenStart()}
});
document.addEventListener("keyup",e=>{
 if(e.code==="Space")listenEnd()
});

render();
</script>
</body>
</html>
